name: Mock CI

on:
  # Run CI when a PR is opened/updated against dev
  pull_request:
    branches: ["dev"]

  # Run after a PR is merged into dev
  push:
    branches: ["dev"]

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write


# ============================================================
# 1. SECURITY + CODE QUALITY
# ============================================================
jobs:
  security:
    name: Security & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Setup Node
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------------
      # Install NPM dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------------
      # Check NPM / SDK dependencies for vulnerabilities
      # --------------------------------------------------------
      - name: NPM Security Audit
        run: npm audit --audit-level=high

      # --------------------------------------------------------
      # SonarQube code quality + security analysis
      # --------------------------------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # 2. BUILD + TEST
  # ============================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # Don't build until security checks pass
    needs: security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Node
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------------
      # Run automated tests
      # --------------------------------------------------------
      - name: Run tests
        run: npm test

      # --------------------------------------------------------
      # Build NPM application
      # --------------------------------------------------------
      - name: Build
        run: npm run build

      # --------------------------------------------------------
      # Save build for deployment
      # --------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-build
          path: |
            dist/
            build/
            package.json
            package-lock.json


  # ============================================================
  # 3. DEPLOY TO DEV
  # ============================================================
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest

    # Only deploy after build succeeds
    needs: build

    # Only deploy when code is pushed to dev.
    # This means a PR must actually be merged before deployment.
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    environment:
      name: dev

    steps:
      # --------------------------------------------------------
      # Download the successful build
      # --------------------------------------------------------
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-build

      # --------------------------------------------------------
      # Load DEV database credentials from GitHub Secrets
      # --------------------------------------------------------
      - name: Configure database credentials
        env:
          DB_USERNAME: ${{ secrets.DEV_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          DB_HOST: ${{ secrets.DEV_DB_HOST }}
        run: |
          echo "DEV database credentials loaded"

      # --------------------------------------------------------
      # Deploy application
      # --------------------------------------------------------
      - name: Deploy to DEV
        env:
          DB_USERNAME: ${{ secrets.DEV_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          DB_HOST: ${{ secrets.DEV_DB_HOST }}
        run: |
          echo "Deploying application to DEV..."

          # Replace this with your actual deployment command.
          # Example:
          # ./deploy.sh
