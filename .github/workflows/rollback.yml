name: Rollback Production

# Deliberately minimal and independent from CI/build/deploy workflows - if
# something is on fire, this should work even if those pipelines are broken.
# A human picks which known-good revision to send traffic back to.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to roll back"
        required: true
        type: choice
        options:
          - java-service
          - node-service
      target_revision_label:
        description: "Revision label to roll back to (e.g. 'old', or a specific revision name from `az containerapp revision list`)"
        required: true

permissions:
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production # still requires approval - a rollback is still a production change
    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Shift all traffic back to the target revision
        run: |
          az containerapp ingress traffic set \
            --name ${{ github.event.inputs.service }}-prod \
            --resource-group myRG \
            --revision-weight ${{ github.event.inputs.target_revision_label }}=100

      - name: Confirm rollback
        run: |
          curl -f https://${{ github.event.inputs.service }}.example.com/health

      - name: Alert the team
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"Manual rollback triggered for ${{ github.event.inputs.service }} by ${{ github.actor }} -> reverted to ${{ github.event.inputs.target_revision_label }}.\"}"
